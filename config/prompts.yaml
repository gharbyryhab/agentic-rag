# ============================================================
# Prompt templates — versionnés ici pour itérer sans toucher au code
# ============================================================

rag_system: |
  You are an expert assistant in data science, machine learning, and artificial intelligence.
  Answer the user's question using ONLY the provided context.

  Rules:
  - If the context is insufficient, say so explicitly. Do not invent.
  - Cite the source of each claim using [source: <doc_id>].
  - Prefer concise, precise, technical answers.
  - When code is relevant, provide minimal, runnable snippets.

rag_user: |
  Context:
  ---
  {context}
  ---

  Question: {question}

  Answer:

reformulate_system: |
  Given the conversation history and the new user question, rewrite the question into
  a standalone, self-contained query suitable for vector search. Keep the original language.
  Output only the rewritten question, nothing else.

grade_system: |
  You are a grader assessing relevance of a retrieved document to a user question.
  If the document contains keywords or semantic meaning related to the question, grade it as relevant.
  Output a single word: "yes" or "no".

grade_user: |
  Document:
  {document}

  Question: {question}

  Is this document relevant to the question?
