# ============================================================
# Agentic RAG — Main configuration
# ============================================================

project:
  name: agentic-rag
  version: 0.1.0

paths:
  data_raw: data/raw
  data_processed: data/processed
  data_chunks: data/chunks
  vector_store: vector_store/chroma
  embedding_cache: vector_store/embedding_cache
  bm25_store: vector_store/bm25
  books_metadata: results/metadata/books_metadata.json
  logs: logs

# ---------- Embeddings ----------
embeddings:
  model_name: BAAI/bge-small-en-v1.5
  device: cpu              # MX130 souvent plus lente que CPU — benchmarker avant de passer à "cuda"
  normalize: true
  batch_size: 32
  # Préfixes recommandés par BAAI pour bge-*-en-v1.5
  query_prefix: "Represent this sentence for searching relevant passages: "
  passage_prefix: ""

# ---------- Chunking ----------
chunking:
  strategy: semantic        # semantic | recursive
  # --- Recursive params (fallback / post-processing) ---
  chunk_size: 1500
  chunk_overlap: 150
  separators: ["\n\n## ", "\n\n### ", "\n\nChapter ", "\n\nSection ", "\n\n", "\n", ". ", " ", ""]
  # --- Semantic params ---
  semantic_breakpoint_type: percentile     # percentile | standard_deviation | interquartile
  semantic_breakpoint_amount: 95.0
  semantic_buffer_size: 1
  # --- Post-processing (any strategy) ---
  min_chunk_chars: 200
  max_chunk_chars: 2000

# ---------- Filters & deduplication ----------
filters:
  enable_pathological_filter: true
  min_alpha_ratio: 0.5            # ≥ 50% alphabetic characters
  min_vocab_diversity: 0.3        # vocab uniqueness ratio
  enable_dedup: true
  dedup_jaccard_threshold: 0.85   # MinHash-LSH near-duplicate threshold
  dedup_num_perm: 128             # MinHash permutations (higher = more accurate)

# ---------- Header / footer cleanup ----------
header_footer:
  enable: true
  occurrence_ratio: 0.3           # remove lines appearing on >30% of pages
  scan_first_lines: 3             # check first N lines of each page
  scan_last_lines: 3              # check last N lines of each page

# ---------- Vector store ----------
vector_store:
  provider: chroma
  collection_name: ds_ml_kb
  persist_directory: vector_store/chroma
  distance: cosine

# ---------- Retrieval ----------
retrieval:
  top_k: 5
  score_threshold: 0.5
  use_mmr: true             # Maximal Marginal Relevance pour la diversité
  mmr_lambda: 0.5
  fetch_k: 20               # candidats avant re-ranking MMR

# ---------- LLM (Gemini) ----------
llm:
  provider: gemini
  model_name: gemma-4-26b-a4b-it    # gemini-1.5-pro pour plus de qualité
  temperature: 0.2
  max_output_tokens: 2048
  top_p: 0.95

# ---------- Agent ----------
agent:
  max_iterations: 6
  enable_query_rewriting: true
  enable_grading: true            # filtre les chunks non pertinents avant generation
  verbose: true
