project:
  name: agentic-rag
  version: 0.1.0
paths:
  data_raw: data/raw
  data_processed: data/processed
  data_chunks: data/chunks
  vector_store: vector_store/chroma
  embedding_cache: vector_store/embedding_cache
  bm25_store: vector_store/bm25
  books_metadata: results/metadata/books_metadata.json
  logs: logs
embeddings:
  model_name: BAAI/bge-small-en-v1.5
  device: cpu
  normalize: true
  batch_size: 32
  query_prefix: 'Represent this sentence for searching relevant passages: '
  passage_prefix: ''
chunking:
  strategy: recursive
  chunk_size: 1500
  chunk_overlap: 150
  separators:
  - '


    ## '
  - '


    ### '
  - '


    Chapter '
  - '


    Section '
  - '


    '
  - '

    '
  - '. '
  - ' '
  - ''
  semantic_breakpoint_type: percentile
  semantic_breakpoint_amount: 95.0
  semantic_buffer_size: 1
  min_chunk_chars: 200
  max_chunk_chars: 2000
filters:
  enable_pathological_filter: true
  min_alpha_ratio: 0.5
  min_vocab_diversity: 0.3
  enable_dedup: true
  dedup_jaccard_threshold: 0.85
  dedup_num_perm: 128
header_footer:
  enable: true
  occurrence_ratio: 0.3
  scan_first_lines: 3
  scan_last_lines: 3
vector_store:
  provider: chroma
  collection_name: ds_ml_kb
  persist_directory: vector_store/chroma
  distance: cosine
retrieval:
  top_k: 5
  fetch_k: 30
  score_threshold: 0.0
  hybrid:
    enable: true
    dense_weight: 1.0
    sparse_weight: 1.0
    rrf_k: 60
  mmr:
    enable: true
    lambda_mult: 0.6
    candidates_after_mmr: 15
  reranker:
    enable: true
    model: cross-encoder/ms-marco-MiniLM-L-6-v2
    device: cpu
    batch_size: 32
llm:
  provider: gemini
  model_name: gemma-4-26b-a4b-it
  temperature: 0.2
  max_output_tokens: 2048
  top_p: 0.95
agent:
  max_iterations: 6
  enable_query_rewriting: true
  enable_grading: true
  verbose: true
  enable_router: true
  router_default: simple
  react:
    max_tool_calls: 5
evaluation:
  testset_path: results/eval/testset.json
  results_dir: results/eval
  testset_size: 50
  # Judge model — chosen for HIGH free-tier RPM and NOT shared with main LLM.
  # gemini-3.1-flash-lite = 15 RPM / 250K TPM (best free-tier option here).
  # Alternatives : gemini-2.5-flash-lite (10 RPM) or gemma-4-31b (15 RPM unlimited TPM).
  judge_model: gemini-3.1-flash-lite
  judge_rpm: 12            # safety margin below the 15 RPM limit
  metrics:
  - faithfulness
  - answer_relevancy
  - context_precision
  - context_recall
